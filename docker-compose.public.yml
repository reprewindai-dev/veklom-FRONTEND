services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.veklom.com}
    image: veklom/frontend:local
    container_name: veklom-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.veklom.com}
      VBB_BACKEND_URL: ${VBB_BACKEND_URL:-https://api.veklom.com}
      CAPPO_BACKEND_URL: ${CAPPO_BACKEND_URL:-https://capi.veklom.com}
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 20s
    networks:
      - public-edge

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: veklom-cloudflared
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./.veklom/runtime/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./.veklom/runtime/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public-edge

networks:
  public-edge:
    name: veklom-public-edge
