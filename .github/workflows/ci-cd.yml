name: veklom-FRONTEND CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: PowerShell script syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Production build
        run: npm run build

      - name: Report build result
        if: success()
        run: echo "Build passed for ${{ github.sha }}"

# This workflow is verification only. It does not make a third-party frontend host
# authoritative for production. Canonical production remains the self-hosted Veklom
# deployment path described in README.md: Coolify/owned infrastructure behind Veklom's
# public routing. GitHub-hosted CI proves the build; it does not own production runtime.
