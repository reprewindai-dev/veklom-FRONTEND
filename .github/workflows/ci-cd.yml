name: veklom-FRONTEND CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Several locked frontend dependencies now require Node >=22.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Production build
        run: npm run build

      - name: Report build size
        if: success()
        run: echo "Build passed for ${{ github.sha }}"

# Production deployment is intentionally not performed by this workflow.
# The previous job targeted a retired Hetzner/Coolify host and therefore did
# not represent Veklom's current deployment topology. CI remains authoritative
# for build/test status; deployment must be re-enabled only when a canonical
# owned-hardware runner/transport is explicitly configured and verified.
