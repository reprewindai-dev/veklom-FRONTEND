name: veklom-FRONTEND CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Production build
        run: npm run build

      - name: Report build result
        if: success()
        run: echo "Build passed for ${{ github.sha }}"

# Deployment is intentionally not performed here. The canonical public topology is
# owned-hardware based; no stale Hetzner/Coolify SSH deployment is allowed to become
# authoritative merely because a frontend PR reaches main. Deployment automation may
# return only after the owned-hardware transport/runner is explicitly verified.
