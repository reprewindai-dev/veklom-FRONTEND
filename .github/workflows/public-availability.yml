name: Veklom Public Availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: veklom-public-availability
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CUSTOM_URL: https://veklom.com/api/health
      VERCEL_URL: https://veklom-control-plane.vercel.app/api/health
    steps:
      - name: Probe public origins
        id: probe
        shell: bash
        run: |
          set +e

          probe() {
            local url="$1"
            for attempt in 1 2 3; do
              code="$(curl --silent --show-error --location --max-time 12 --output /tmp/probe-body --write-out '%{http_code}' "$url")"
              if [ "$code" = "200" ]; then
                echo "UP $url on attempt $attempt"
                return 0
              fi
              echo "DOWN $url attempt=$attempt http=$code"
              sleep 4
            done
            return 1
          }

          if probe "$CUSTOM_URL"; then
            echo "custom_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "custom_ok=false" >> "$GITHUB_OUTPUT"
          fi

          if probe "$VERCEL_URL"; then
            echo "vercel_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update outage issue
        if: steps.probe.outputs.custom_ok != 'true'
        shell: bash
        run: |
          if [ "${{ steps.probe.outputs.vercel_ok }}" = "true" ]; then
            title="[Availability] veklom.com custom route degraded"
            body="The custom domain health probe failed three times while the Vercel production origin remained healthy. This isolates the incident to DNS/Cloudflare/tunnel/custom-domain routing rather than the frontend build itself.\n\nCustom: $CUSTOM_URL\nVercel: $VERCEL_URL\nWorkflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            title="[Availability] Veklom public frontend degraded"
            body="Both the custom domain and Vercel production health probes failed three times. Treat this as a frontend/deployment incident.\n\nCustom: $CUSTOM_URL\nVercel: $VERCEL_URL\nWorkflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close recovered availability issues
        if: steps.probe.outputs.custom_ok == 'true'
        shell: bash
        run: |
          for title in \
            "[Availability] veklom.com custom route degraded" \
            "[Availability] Veklom public frontend degraded"; do
            number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Recovered: the custom domain health probe is returning HTTP 200 again. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
          done

      - name: Fail when custom domain is unavailable
        if: steps.probe.outputs.custom_ok != 'true'
        run: exit 1
